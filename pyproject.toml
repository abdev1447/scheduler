[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduler"
version = "0.1.0"
description = "A personal schedule management website."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["scheduler"]
include-package-data = true

[tool.setuptools.package-data]
scheduler = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
