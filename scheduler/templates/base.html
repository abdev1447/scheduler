<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Scheduler{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="{{ url_for('events.dashboard') }}" aria-label="Scheduler home">
      <svg class="logo__mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="6" width="26" height="23" rx="5" fill="currentColor"/>
        <rect x="3" y="6" width="26" height="7" rx="3" fill="#fff" fill-opacity=".25"/>
        <rect x="9" y="2" width="3" height="8" rx="1.5" fill="currentColor"/>
        <rect x="20" y="2" width="3" height="8" rx="1.5" fill="currentColor"/>
        <path d="M10 20.5l4 4 8-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logo__text">Scheduler</span>
    </a>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
